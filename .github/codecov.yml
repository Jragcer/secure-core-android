codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "60...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%

# Exclusiones
ignore:
  - "app/**"                 # Ignora la app de demostración al completo
  - "**/BuildConfig.*"       # Ignora código autogenerado de Android
  - "**/R.class"
  - "**/R$*.class"
  - "**/*Test*.*"            # Evita medir clases de test dentro del coverage