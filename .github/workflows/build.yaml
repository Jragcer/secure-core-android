name: Android CI

on:
  push:
    branches: [ "main"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Static code analysis (linting)
  # -------------------------------------------------------------
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure execution permissions for the Gradle Wrapper
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android Lint
        run: ./gradlew lintDebug --continue

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
          retention-days: 7

  # -------------------------------------------------------------
  # Job 2: Parallel unit testing
  # -------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure execution permissions for the Gradle Wrapper
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests with coverage
        run: ./gradlew :SecurityCore:createDebugUnitTestCoverageReport --continue

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Jragcer/secure-core-android
          files: SecurityCore/build/reports/coverage/test/debug/report.xml
          fail_ci_if_error: false

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

  # -------------------------------------------------------------
  # Job 3: Compilación y empaquetado de artefactos
  # -------------------------------------------------------------
  build-and-assemble:
    name: Assemble Artifacts
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure execution permissions for the Gradle Wrapper
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble SDK AAR & App APK
        run: ./gradlew :SecurityCore:assembleRelease :app:assembleDebug --stacktrace

      - name: Upload SDK AAR Library
        uses: actions/upload-artifact@v4
        with:
          name: security-core-sdk
          path: SecurityCore/build/outputs/aar/*.aar
          retention-days: 14

      - name: Upload Demo App APK
        uses: actions/upload-artifact@v4
        with:
          name: demo-app-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14